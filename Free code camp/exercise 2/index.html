<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paleta de color</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--Link para el boton-->
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="color-palette-container" class="color-palette-container">
      <h1>Creador de paletas de colores</h1>

      <!-- el boton !-->
      <button id="color-palette-button" class="color-button">
        <i class="fas fa-sync"></i>
        Generar paleta
      </button>
      <div id="colors-container" class="colors">
        <!--Primera caja, el resto lo mismo, divs distintos y background olor se cammbia en el js-->
        <div class="color-box">
          <div class="color" style="background-color: #e1e1e1"></div>
          <div class="color-text">
            <span class="hex-valor">#E1E1E1</span>
            <i class="far fa-copy copy-btn" title="Copiar el valor"></i>
          </div>
        </div>
     
   
        <!--Primera caja, el resto lo mismo, divs distintos y background olor se cammbia en el js-->
        <div class="color-box">
          <div class="color" style="background-color: #c56060"></div>
          <div class="color-text">
            <span class="hex-valor">#C56060</span>
            <i class="far fa-copy copy-btn" title="Copiar el valor"></i>
          </div>
        </div>
   
      
        <!--Primera caja, el resto lo mismo, divs distintos y background olor se cammbia en el js-->
        <div class="color-box">
          <div class="color" style="background-color: #1aafa8"></div>
          <div class="color-text">
            <span class="hex-valor">#1AAFA8</span>
            <i class="far fa-copy copy-btn" title="Copiar el valor"></i>
          </div>
        </div>
    
   
        <!--Primera caja, el resto lo mismo, divs distintos y background olor se cammbia en el js-->
        <div class="color-box">
          <div class="color" style="background-color: #e241e7"></div>
          <div class="color-text">
            <span class="hex-valor">#E241E7</span>
            <i class="far fa-copy copy-btn" title="Copiar el valor"></i>
          </div>
        </div>
     
        <!--Primera caja, el resto lo mismo, divs distintos y background olor se cammbia en el js-->
        <div class="color-box">
          <div class="color" style="background-color: #c0f55f"></div>
          <div class="color-text">
            <span class="hex-valor">#C0F55F</span>
            <i class="far fa-copy copy-btn" title="Copiar el valor"></i>
          </div>
        </div>
     
    </div>
    <script src="ej2.js"></script>
  </body>
</html>
