<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesc.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Formulario de contacto</title>
  </head>
  <body>
    <form id="form" class="form active">
      <h2>Formulario de contacto</h2>
      <fieldset>
        <legend required>Informacion obligatoria</legend>
        <div>
          <label for="nombre"
            >Nombre completo
            <input
              type="text"
              placeholder="Ej: Juan perez"
              class="form-input"
              id="nombre"
              required
            />
          </label>
        </div>
        <div>
          <label for="correo"
            >Correo electronico
            <input
              required
              type="email"
              placeholder="Ej: juanperez@gmail.com"
              class="form-input"
              id="correo"
            />
          </label>
        </div>
        <div>
          <label id="telefono" for="Telefono"
            >Telefono de contacto
            <input
              required
              type="tel"
              placeholder="11-1234-5678"
              id="telefono"
            />
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Informacion opcional</legend>
        <div>
          <!--SELECT-->
          <label for="tipo"
            >¿Como nos conociste?
            <select>
              <option value="ans1">Redes sociales</option>
              <option value="ans2">Amigos</option>
              <option value="ans3">Empresa</option>
            </select>
          </label>
        </div>
        <div>
          <!--DATALIST-->
          <label
            >Referente <input list="referente" name="Referente" />
            <!--El input es indispensable-->
            <datalist id="referente" name="form.inp">
              <!--No funciona muy distinto al select-->
              <option value="Juan Freitas">Jefe de empresa Anthropic</option>
              <!--El value es lo que recibe la máquina mientras que lo que esta entre las options es una descripción-->
              <option value="Pasante">Sistema de pasantias</option>
              <option value="Francisco Juarez">
                Rector universitario Unlam
              </option>
            </datalist>
          </label>
        </div>
        <div>
          <label for="msj"
            >Mensaje
            <textarea
              rows="6"
              placeholder="Informacion adicional"
              class="form-input"
              id="msj"
            ></textarea
            ><!--Los rows son columnas para escribir, evita el scroll si la altura minima es corta en relacion al texto-->
          </label>
        </div>
      </fieldset>
      <div class="form-bottom">
        <label for="ch"
          >Acepto los <a href="">terminos y condiciones</a>
          <input required type="checkbox" class="check" id="ch" />
          <!--el class siemroe va adentro del input-->
        </label>
        <button id="form-btn" class="btn">Enviar</button>
      </div>
    </form>

    <div id="msg" class="msg">
      <i class="fas fa-check"></i>
      <p>El formulario fue enviado</p>
    </div>
    <script src="cont.js"></script>
  </body>
</html>
