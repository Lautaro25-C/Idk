<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Quiz game</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poller+One:regular"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen">
        <h1>Quiz time!</h1>
        <p class="start-text" id="start-t">
          Test your knowledge with this questions!
        </p>
        <button class="start-button" id="start-btn">Start quiz</button>
      </div>
      <div class="screen" id="screen-q">
        <div class="quiz-header">
          <h2 id="Question-text">Question</h2>

          <div class="quiz-info">
            <p>
              Question <span id="current-question">1</span> of
              <span id="total-questions">5</span>
            </p>
            <p>
              Score:
              <span id="score"> 0</span>
            </p>
          </div>
        </div>
        <div id="answers-container" class="answers">
          <!--Los botones se añaden desde java-->
        </div>
        <div class="progress-bar">
          <div id="progress" class="progress"></div>
        </div>
      </div>
      <div id="result-screen" class="screen">
        <h1>Quiz results</h1>
        <div class="result-info">
          <p>
            You scored <span id="total-score">0</span> out of
            <span id="max-score">5</span>
          </p>

          <div id="result-message">67</div>
        </div>
        <button id="restart-btn">Restart quiz</button>
      </div>
    </div>
    <script src="exercise1.js"></script>
  </body>
</html>
